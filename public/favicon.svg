<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#080c15"/>
  
  <!-- Subtle border glow -->
  <rect x="2" y="2" width="508" height="508" rx="94" ry="94" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.5"/>
  
  <!-- RM Text with gradient -->
  <text x="256" y="320" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="280" fill="url(#emeraldGrad)" filter="url(#glow)">RM</text>
  
  <!-- Gold shimmer overlay -->
  <text x="256" y="320" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="280" fill="url(#goldShimmer)">RM</text>
</svg>

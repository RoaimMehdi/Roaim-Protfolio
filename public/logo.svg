<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="emeraldGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.25" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" ry="40" fill="#080c15"/>
  
  <!-- Border -->
  <rect x="1.5" y="1.5" width="197" height="197" rx="38.5" ry="38.5" fill="none" stroke="url(#emeraldGradLogo)" stroke-width="2" opacity="0.4"/>
  
  <!-- RM Text -->
  <text x="100" y="128" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="108" fill="url(#emeraldGradLogo)" filter="url(#softGlow)">RM</text>
  
  <!-- Gold overlay -->
  <text x="100" y="128" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="108" fill="url(#goldAccent)">RM</text>
</svg>
